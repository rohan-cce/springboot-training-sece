<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Account Directory</title>
    <!-- Basic aesthetic CSS mapping so we don't have to write CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body { padding: 40px; max-width: 900px; margin: 0 auto; }
        .form-container { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Bank Account Directory</h1>
    
    <div class="form-container">
        <h3>Add a New Account</h3>
        <!-- Note: We use Javascript to submit this form, no 'action' attribute is needed -->
        <form id="account-form">
            <label>Account Holder Name: </label>
            <input type="text" id="accountHolderName" required placeholder="Enter account holder name" />
            
            <label>Initial Balance: </label>
            <input type="number" step="0.01" id="balance" required min="1" placeholder="Enter robust initial balance" />
            
            <button type="submit">Save Account</button>
        </form>
    </div>

    <h3>Registered Accounts</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Account Holder Name</th>
                <th>Balance</th>
            </tr>
        </thead>
        <!-- Empty body; Javascript will aggressively build the rows here dynamically -->
        <tbody id="account-table">
        </tbody>
    </table>

    <script>
        // 1. Fetch Accounts from the API (GET Request)
        function loadBankAccounts() {
            fetch('/accounts')
                .then(response => response.json())
                .then(accounts => {
                    const table = document.getElementById('account-table');
                    table.innerHTML = ''; // Clear old visual data
                    
                    // Loop through the JSON array and construct HTML strings natively
                    accounts.forEach(account => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${account.id}</td>
                            <td>${account.accountHolderName}</td>
                            <td>$${account.balance}</td>
                        `;
                        table.appendChild(tr);
                    });
                });
        }

        // 2. Add New Account (POST Request)
        document.getElementById('account-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Stop page from hard-refreshing
            
            // Extract what the user typed in the boxes
            const holderVal = document.getElementById('accountHolderName').value;
            const balanceVal = document.getElementById('balance').value;

            // Make the background API call
            fetch('/accounts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ accountHolderName: holderVal, balance: balanceVal })
            })
            .then(response => {
                if (response.ok) {
                    loadBankAccounts(); // Reload table visualizing new data
                    document.getElementById('account-form').reset(); // Clear form inputs
                } else {
                    alert('Validation error saving account (Check constraints!).');
                }
            });
        });

        // Run this automatically as soon as the HTML page loads
        loadBankAccounts();
    </script>
</body>
</html>
