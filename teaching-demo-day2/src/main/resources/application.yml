server:
  port: 8080
spring:
  application:
    name: teaching-demo
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:studentdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
